<script type="application/ld+json">{
  "@context": "https://schema.org",
  "@type": "LearningResource",
  "name": "Products | Study AI/ML with Champak Roy, Varanasi",
  "description": "Learn Products as part of practical AI/ML, Python, DSA and web development training with Champak Roy of Varanasi. Beginner-friendly 0 to infinity lessons.",
  "url": "https://dsa.learnwithchampak.live/spring/e-commerce/spring-boot-reference/src/main/resources/templates/products/list.html",
  "image": "https://dsa.learnwithchampak.live/assets/images/og-aiml-champak-roy-varanasi.png",
  "inLanguage": "en",
  "creator": {
    "@type": "Person",
    "name": "Champak Roy",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Varanasi",
      "addressCountry": "IN"
    }
  },
  "publisher": {
    "@type": "Organization",
    "name": "Programmer's Picnic by Champak Roy",
    "url": "https://dsa.learnwithchampak.live"
  },
  "about": [
    "Artificial Intelligence",
    "Machine Learning",
    "Python",
    "Data Structures and Algorithms",
    "Web Development"
  ],
  "audience": {
    "@type": "Audience",
    "audienceType": "Students and beginner programmers"
  },
  "isAccessibleForFree": true
}</script></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
<h1>Products</h1>
<section>
<article th:each="p : ${products}">
<h2 th:text="${p.name}">Product name</h2>
<p th:text="${p.description}">Description</p>
<p>Price: <span th:text="${p.price}">0</span></p>
<p>Stock: <span th:text="${p.stock}">0</span></p>
<form method="post" th:action="@{/cart/add}">
<input name="productId" th:value="${p.id}" type="hidden"/>
<input min="1" name="quantity" type="number" value="1"/>
<button type="submit">Add to Cart</button>
</form>
</article>
</section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

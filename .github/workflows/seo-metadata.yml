name: Maintain SEO, AdSense and Sitemap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-metadata-main
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public page SEO, AdSense loader and XML sitemap
        run: python scripts/update_seo.py
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML valid')"
      - name: Commit and publish generated site metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml seo-update-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Maintain SEO tags, Google ads and sitemap automatically"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

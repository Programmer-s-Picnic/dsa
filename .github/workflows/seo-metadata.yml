name: Normalize HTML SEO metadata
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_seo.py'
      - '.github/workflows/seo-metadata.yml'
      - 'aspnet/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add missing SEO metadata to HTML pages
        run: python scripts/update_seo.py
      - name: Commit changed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' seo-update-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Normalize page-level SEO metadata and canonical links"
            git push
          fi

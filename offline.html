<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Offline | DSA Learning Path</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: radial-gradient(circle at top, #dbeafe, #f4f9ff 45%);
    }
    main {
      width: min(34rem, 100%);
      padding: 2rem;
      text-align: center;
      background: #fff;
      border: 1px solid #bfdbfe;
      border-radius: 1.5rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .1);
    }
    .mark {
      width: 5rem;
      height: 5rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      border-radius: 1.25rem;
      color: #fff;
      background: #2563eb;
      font-size: 1.5rem;
      font-weight: 800;
    }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    p { margin: 0 0 1.5rem; color: #475569; }
    button {
      min-height: 3rem;
      padding: .75rem 1.25rem;
      border: 0;
      border-radius: .8rem;
      color: #fff;
      background: #2563eb;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">DSA</div>
    <h1>You are offline</h1>
    <p>Previously opened lessons may still be available. Reconnect to load a new lesson.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>

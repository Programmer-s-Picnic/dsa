<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Put this inside <head> -->

    <title>M × N Grid Highlighter | Row Column Expression Visualizer</title>

    <meta name="description"
        content="Create an M x N grid and highlight cells using row and column expressions like row=1, col>=4, row<=3 and col>2. A simple interactive HTML learning tool.">

    <meta name="keywords"
        content="M x N grid, row column grid, grid highlighter, HTML grid generator, CSS grid, JavaScript grid, row col expression, programming learning tool, Champak Roy">

    <meta name="author" content="Champak Roy">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.learnwithchampak.live/">

    <meta property="og:title" content="M × N Grid Highlighter">
    <meta property="og:description"
        content="Interactive HTML tool to create an M x N grid and highlight cells using row and column expressions.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dsa.learnwithchampak.live/visualizers/patterns">
    <meta property="og:image" content="https://dsa.learnwithchampak.live/grid-highlighter.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="M × N Grid Highlighter">
    <meta name="twitter:description"
        content="Create an M x N grid and highlight cells using expressions such as row=1 and col=4.">
    <meta name="twitter:image" content="https://dsa.learnwithchampak.live/grid-highlighter.png">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef8f8;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #00695c;
        }

        .controls {
            margin: 15px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #00897b;
        }

        button {
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #00897b;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #rows,
        #cols {
            width: 80px;
        }

        #expression {
            width: 360px;
        }

        .grid-box {
            max-width: 95vw;
            max-height: 65vh;
            overflow: auto;
            border: 2px solid #00897b;
            border-radius: 10px;
            background: #dff4f2;
            padding: 12px;
            margin: 20px auto;
        }

        #grid {
            display: grid;
            gap: 5px;
            justify-content: center;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            width: 90px;
            height: 70px;
            border: 2px solid #00897b;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #00695c;
        }

        .highlight {
            background: #ffd54f;
            border-color: #ff6f00;
            color: #000;
        }

        .python-section {
            width: min(1100px, 95vw);
            margin: 24px auto;
            padding: 18px;
            box-sizing: border-box;
            border: 2px solid #00897b;
            border-radius: 10px;
            background: #ffffff;
            text-align: left;
        }

        .video-section {
            width: min(900px, 95vw);
            margin: 24px auto;
            padding: 18px;
            box-sizing: border-box;
            border: 2px solid #00897b;
            border-radius: 10px;
            background: #ffffff;
        }

        .video-section h2 {
            margin-top: 0;
            color: #00695c;
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .python-section h2 {
            margin-top: 0;
            color: #00695c;
            text-align: center;
        }

        #pythonCode {
            width: 100%;
            min-height: 260px;
            padding: 14px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #00897b;
            border-radius: 8px;
            background: #102a2e;
            color: #e8ffff;
            font: 15px/1.5 Consolas, Monaco, monospace;
        }

        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
        }

        #pythonEditor {
            width: 100%;
            height: 620px;
            border: 1px solid #00897b;
            border-radius: 8px;
            background: white;
        }

        #codeStatus {
            min-height: 1.4em;
            text-align: center;
            color: #00695c;
        }

        @media (max-width: 650px) {
            #expression { width: min(360px, 85vw); }
            #pythonEditor { height: 520px; }
            .cell { width: 72px; height: 58px; }
        }
    </style>
</head>

<body>

    <h1>M × N Grid Highlighter</h1>

    <div class="controls">
        Rows:
        <input type="number" id="rows" value="7" min="1">

        Columns:
        <input type="number" id="cols" value="7" min="1">

        <button onclick="makeGrid()">Generate Grid</button>
    </div>

    <div class="controls">
        Expression:
        <input type="text" id="expression" value="row=1 and col=4" oninput="highlightGrid()"
            placeholder="Example: row=1 and col=4">
    </div>

    <p>
        Examples:
        <br>
        <code>row=1</code>,
        <code>col>=4</code>,
        <code>row<=3 and col>2</code>,
        <code>row!=1</code>
    </p>

    <div class="grid-box">
        <div id="grid"></div>
    </div>

    <section class="video-section" aria-labelledby="videoTitle">
        <h2 id="videoTitle">Learn How to Build Grid Patterns</h2>
        <div class="video-frame">
            <iframe src="https://www.youtube-nocookie.com/embed/GlmZg64sebM"
                title="Python grid pattern lesson by Learn With Champak"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
        </div>
    </section>

    <section class="python-section" aria-labelledby="pythonTitle">
        <h2 id="pythonTitle">Python Code for This Grid</h2>
        <p>The code is regenerated whenever the grid size or expression changes.</p>
        <textarea id="pythonCode" spellcheck="false" aria-label="Generated Python code"></textarea>
        <div class="editor-actions">
            <button type="button" onclick="copyPythonCode()">Copy Python Code</button>
            <button type="button" onclick="loadPythonEditor()">Reload Code in Editor</button>
        </div>
        <div id="codeStatus" role="status" aria-live="polite"></div>
        <iframe id="pythonEditor" title="Learn With Champak Python Editor" loading="lazy"
            allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>

    <script>
        function makeGrid() {

            let rows = parseInt(document.getElementById("rows").value);
            let cols = parseInt(document.getElementById("cols").value);

            let grid = document.getElementById("grid");

            grid.innerHTML = "";

            grid.style.gridTemplateColumns = `repeat(${cols}, 90px)`;

            for (let row = 1; row <= rows; row++) {

                for (let col = 1; col <= cols; col++) {

                    let cell = document.createElement("div");
                    cell.className = "cell";

                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    cell.textContent = `(${row}, ${col})`;

                    grid.appendChild(cell);
                }
            }

            highlightGrid();
        }

        function pythonExpression(expression) {
            let result = expression.trim().toLowerCase();
            result = result.replace(/&&/g, " and ").replace(/\|\|/g, " or ");
            result = result.replace(/\brow\b/g, "row").replace(/\bcol\b/g, "col");
            result = result.replace(/\bm\b/g, "m").replace(/\bn\b/g, "n");
            result = result.replace(/!1=/g, "!=");
            result = result.replace(/(?<![!<>=])=(?!=)/g, "==");
            return result || "False";
        }

        function generatePythonCode() {
            const m = Math.max(1, parseInt(document.getElementById("rows").value) || 1);
            const n = Math.max(1, parseInt(document.getElementById("cols").value) || 1);
            const condition = pythonExpression(document.getElementById("expression").value);

            const code = `# Generated by the M x N Grid Highlighter
m = ${m}
n = ${n}

# Change this expression to explore another pattern.
def should_highlight(row, col):
    return ${condition}

for row in range(1, m + 1):
    for col in range(1, n + 1):
        if should_highlight(row, col):
            print("■", end=" ")
        else:
            print("·", end=" ")
    print()
`;

            document.getElementById("pythonCode").value = code;
            scheduleEditorUpdate();
        }

        function editorUrl(code) {
            const payload = JSON.stringify({ code: code });
            const bytes = new TextEncoder().encode(payload);
            let binary = "";
            bytes.forEach(byte => binary += String.fromCharCode(byte));
            const encoded = btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            return "https://editor.learnwithchampak.live/python-starter/editor/super/#" + encoded;
        }

        let editorTimer;
        function scheduleEditorUpdate() {
            clearTimeout(editorTimer);
            editorTimer = setTimeout(loadPythonEditor, 450);
        }

        function loadPythonEditor() {
            const code = document.getElementById("pythonCode").value;
            document.getElementById("pythonEditor").src = editorUrl(code);
            document.getElementById("codeStatus").textContent = "Current grid code loaded in the editor.";
        }

        async function copyPythonCode() {
            const code = document.getElementById("pythonCode").value;
            try {
                await navigator.clipboard.writeText(code);
                document.getElementById("codeStatus").textContent = "Python code copied.";
            } catch (error) {
                const area = document.getElementById("pythonCode");
                area.select();
                document.execCommand("copy");
                document.getElementById("codeStatus").textContent = "Python code copied.";
            }
        }

        function checkExpression(expression, row, col, m, n) {

            expression = expression.toLowerCase();

            expression = expression.replaceAll("and", "&&");
            expression = expression.replaceAll("or", "||");

            expression = expression.replace(/\brow\b/g, row);
            expression = expression.replace(/\bcol\b/g, col);

            expression = expression.replace(/\bm\b/g, m);
            expression = expression.replace(/\bn\b/g, n);

            expression = expression.replace(/!1=/g, "!=");
            expression = expression.replace(/(?<![!<>=])=(?![=])/g, "==");

            try {
                return Function("return " + expression)();
            }
            catch (error) {
                return false;
            }
        }

        function highlightGrid() {

            let cells = document.querySelectorAll(".cell");
            let expression = document.getElementById("expression").value;

            let m = parseInt(document.getElementById("rows").value);
            let n = parseInt(document.getElementById("cols").value);

            cells.forEach(function (cell) {

                let row = Number(cell.dataset.row);
                let col = Number(cell.dataset.col);

                cell.classList.remove("highlight");

                if (checkExpression(expression, row, col, m, n)) {
                    cell.classList.add("highlight");
                }
            });

            generatePythonCode();
        }

        document.getElementById("rows").addEventListener("input", makeGrid);
        document.getElementById("cols").addEventListener("input", makeGrid);
        document.getElementById("pythonCode").addEventListener("input", scheduleEditorUpdate);

        makeGrid();
    </script>
</body>

</html>
